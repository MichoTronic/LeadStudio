<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex,nofollow">
  <title>Lead Studio | Timeless Tech</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://timeless-studio-auth.web.app" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=4.0.7">
</head>
<body class="auth-locked">
  <section class="auth-gate" aria-live="polite">
    <div class="auth-panel">
      <div class="brand-mark" aria-hidden="true">TT</div>
      <p class="eyebrow">Timeless Tech</p>
      <h1>Lead Studio</h1>
      <p id="auth-message" class="auth-message">Checking access...</p>
      <div class="auth-actions">
        <button id="auth-signin-button" class="button button-primary" type="button">Authorize with Google</button>
        <button id="auth-signout-button" class="button button-secondary hidden" type="button">Sign out</button>
      </div>
    </div>
  </section>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">TT</span>
        <div>
          <span>Timeless Tech</span>
          <strong>Lead Studio</strong>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="viewer-label" class="viewer-label">Authorized user</span>
        <a id="legacy-link" class="icon-button" href="#" target="_blank" rel="noopener" title="Open legacy operations" aria-label="Open legacy operations"><i data-lucide="external-link"></i></a>
        <button id="refresh-button" class="icon-button" type="button" title="Refresh leads" aria-label="Refresh leads"><i data-lucide="refresh-cw"></i></button>
        <button id="topbar-signout-button" class="icon-button" type="button" title="Sign out" aria-label="Sign out"><i data-lucide="log-out"></i></button>
      </div>
    </header>

    <section class="metric-band" aria-label="Lead overview">
      <button class="metric" type="button" data-metric-filter="" aria-pressed="true"><span>All leads</span><strong id="metric-all">0</strong></button>
      <button class="metric" type="button" data-metric-filter="lead" aria-pressed="false"><span>New lead</span><strong id="metric-new">0</strong></button>
      <button class="metric" type="button" data-metric-filter="qualified leads" aria-pressed="false"><span>Qualified</span><strong id="metric-qualified">0</strong></button>
      <button class="metric" type="button" data-metric-filter="active" aria-pressed="false"><span>Active</span><strong id="metric-active">0</strong></button>
      <button class="metric" type="button" data-metric-filter="not active" aria-pressed="false"><span>Not active</span><strong id="metric-inactive">0</strong></button>
      <button class="metric" type="button" data-metric-filter="onboarded" aria-pressed="false"><span>Onboarded</span><strong id="metric-onboarded">0</strong></button>
    </section>

    <section class="workspace">
      <header class="workspace-header">
        <div>
          <h1>Contacts</h1>
          <p id="result-count" class="result-count">Loading...</p>
        </div>
        <div class="workspace-actions">
          <details id="export-menu" class="export-menu">
            <summary class="icon-button" title="Export filtered contacts" aria-label="Export filtered contacts"><i data-lucide="download"></i></summary>
            <div class="export-options">
              <button id="export-csv-button" type="button"><i data-lucide="file-text"></i><span>Download CSV</span></button>
              <button id="export-xlsx-button" type="button"><i data-lucide="sheet"></i><span>Download XLSX</span></button>
            </div>
          </details>
          <span class="mode-badge">Preview</span>
        </div>
      </header>

      <div class="filters" aria-label="Lead filters">
        <label class="search-field">
          <i data-lucide="search" aria-hidden="true"></i>
          <span class="sr-only">Search contacts</span>
          <input id="search-input" type="search" placeholder="Search contacts" autocomplete="off">
        </label>
        <label>
          <span class="sr-only">Lead status</span>
          <select id="status-filter"><option value="">All statuses</option></select>
        </label>
        <label>
          <span class="sr-only">Onboarding status</span>
          <select id="onboarding-filter">
            <option value="">All onboarding</option>
            <option value="complete">Complete</option>
            <option value="pending">Pending</option>
          </select>
        </label>
        <div class="date-controls" aria-label="Email date range">
          <label>
            <span class="sr-only">Date preset</span>
            <select id="date-filter">
              <option value="">All dates</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </label>
          <label class="date-input-field"><span>From</span><input id="date-from-input" type="date"></label>
          <label class="date-input-field"><span>To</span><input id="date-to-input" type="date"></label>
        </div>
        <button id="clear-filters" class="icon-button" type="button" title="Clear filters" aria-label="Clear filters"><i data-lucide="filter-x"></i></button>
      </div>
      <div class="facet-filters" aria-label="Contact attributes">
        <details class="filter-menu">
          <summary id="business-filter-summary">Business type</summary>
          <div id="business-filter-options" class="filter-options"></div>
        </details>
        <details class="filter-menu">
          <summary id="region-filter-summary">Target region</summary>
          <div id="region-filter-options" class="filter-options"></div>
        </details>
        <details class="filter-menu">
          <summary id="interest-filter-summary">Interested in</summary>
          <div id="interest-filter-options" class="filter-options"></div>
        </details>
      </div>

      <p id="error-banner" class="error-banner" hidden></p>
      <div id="loading-state" class="loading-state"><span class="spinner" aria-hidden="true"></span>Loading contacts</div>
      <div id="empty-state" class="empty-state" hidden>No contacts match these filters.</div>

      <div id="desktop-table" class="table-wrap" hidden>
        <table>
          <thead><tr><th data-sort-header="emailDate" aria-sort="descending"><button class="sort-button" type="button" data-sort-field="emailDate"><span>Date</span><i data-lucide="arrow-down"></i></button></th><th>Contact</th><th data-sort-header="companyName" aria-sort="none"><button class="sort-button" type="button" data-sort-field="companyName"><span>Company</span><i data-lucide="arrow-up-down"></i></button></th><th>Region</th><th>Interest</th><th>Status</th><th>Jira</th><th>Onboarding</th><th><span class="sr-only">Details</span></th></tr></thead>
          <tbody id="lead-table-body"></tbody>
        </table>
      </div>
      <div id="mobile-list" class="mobile-list" hidden></div>
    </section>
  </main>

  <dialog id="lead-dialog" class="lead-dialog">
    <div class="dialog-header">
      <div><span class="eyebrow">Contact details</span><h2 id="dialog-title">Contact</h2></div>
      <button id="dialog-close" class="icon-button" type="button" title="Close" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div id="dialog-content" class="dialog-content"></div>
  </dialog>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://timeless-studio-auth.web.app/studio-sso-client.js"></script>
  <script src="/export-utils.js?v=4.0.1"></script>
  <script src="/lead-list-utils.js?v=4.0.2"></script>
  <script type="module" src="/app.js?v=4.0.18"></script>
</body>
</html>
